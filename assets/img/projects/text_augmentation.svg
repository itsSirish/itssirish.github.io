<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="Helvetica, Arial, sans-serif">
  <title>Entity-preserving text augmentation for noisy NER</title>
  <rect width="600" height="340" rx="14" fill="#f7f9fc"/>

  <!-- noisy input tweet -->
  <text x="30" y="42" font-size="15" font-weight="700" fill="#5b6472">NOISY TWEET</text>
  <rect x="30" y="54" width="540" height="54" rx="10" fill="#fff" stroke="#d5dbe5"/>
  <text x="48" y="88" font-size="19" fill="#2b2f36">omg cant wait 4
    <tspan fill="#c0392b" font-weight="700">taylor swift</tspan> in
    <tspan fill="#2471a3" font-weight="700">nyc</tspan> 2nite!!</text>

  <!-- pipeline -->
  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="30" y="140" width="160" height="50" rx="10" fill="#e8f0fb" stroke="#2471a3"/>
    <text x="110" y="171" fill="#1f4f80">Entity placeholders</text>

    <rect x="220" y="140" width="160" height="50" rx="10" fill="#f3ecfb" stroke="#7b4fd6"/>
    <text x="300" y="171" fill="#55349f">LLaMA 2 paraphrase</text>

    <rect x="410" y="140" width="160" height="50" rx="10" fill="#e9f7ef" stroke="#1e8449"/>
    <text x="490" y="171" fill="#186a3b">BERTScore filter</text>
  </g>
  <g stroke="#8a94a6" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M190 165 H214"/>
    <path d="M380 165 H404"/>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a94a6"/>
    </marker>
  </defs>

  <!-- augmented outputs -->
  <text x="30" y="226" font-size="15" font-weight="700" fill="#5b6472">AUGMENTED, LABELS KEPT</text>
  <rect x="30" y="238" width="540" height="40" rx="8" fill="#fff" stroke="#d5dbe5"/>
  <text x="46" y="264" font-size="17" fill="#2b2f36">So excited to see <tspan fill="#c0392b" font-weight="700">Taylor Swift</tspan> in <tspan fill="#2471a3" font-weight="700">NYC</tspan> tonight!</text>
  <rect x="30" y="286" width="540" height="40" rx="8" fill="#fff" stroke="#d5dbe5"/>
  <text x="46" y="312" font-size="17" fill="#2b2f36"><tspan fill="#c0392b" font-weight="700">Taylor Swift</tspan> plays <tspan fill="#2471a3" font-weight="700">NYC</tspan> tonight and I can't wait</text>
</svg>
